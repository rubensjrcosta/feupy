name: feupy

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # System libraries
  - libxml2
  - lxml
  - gcc

  # Core scientific stack
  - numpy>=1.22
  - scipy>=1.10
  - matplotlib>=3.8,<3.10
  - pandas>=2.0
  - pyyaml>=6.0
  - tqdm>=4.65
  - regions>=0.7,<0.12

  # Astronomy / gamma-ray tools
  - astropy>=6.0
  - naima>=0.10.0
  - gammapy=2.0

  # Jupyter ecosystem
  - jupyter>=1.0
  - ipykernel>=6.0

  # Test / development dependencies
  - pytest
  - pytest-cov
  - pytest-mock
  - ruff
  - pydocstyle

  # Editable project install
  - pip:
      - -e .