name: feupy

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # System libraries
  - libxml2
  - lxml
  - gcc

  # Core scientific stack
  - numpy>=1.22
  - scipy>=1.10
  - matplotlib>=3.7
  - pandas>=2.0
  - pyyaml
  - tqdm

  # Astronomy / gamma-ray tools
  - astropy>=6.0
  - naima>=0.10
  - gammapy=2.0

  # Jupyter ecosystem
  - jupyter
  - ipykernel

  # Test dependencies
  - pytest
  - pytest-cov
  - pytest-mock

  # Editable project install
  - pip:
      - -e .