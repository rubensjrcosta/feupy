[build-system]
requires = [
    "setuptools>=77.0.3",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "feupy"
version = "0.1.0"

description = "Open-source Python tools for very-high-energy gamma-ray analysis, modeling, and simulations"

readme = "README.md"

requires-python = ">=3.10"

license = "BSD-3-Clause"
license-files = ["LICENSE"]

authors = [
    { name = "Rubens Costa Jr.", email = "rubensp@utfpr.edu.br" },
    { name = "Rita C. dos Anjos", email = "ritacassia@ufpr.br" },
]

keywords = [
    "gamma-ray astronomy",
    "very-high-energy gamma rays",
    "CTAO",
    "Gammapy",
    "astrophysics",
    "scientific software",
]

dependencies = [
    "gammapy==2.0",
    "naima>=0.10.0",
    "astropy>=6.0",
    "numpy>=1.22",
    "scipy>=1.10",
    "matplotlib>=3.8,<3.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "regions>=0.7",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "pydocstyle",
]

notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]


[project.urls]
Homepage = "https://github.com/rubensjrcosta/feupy"
Repository = "https://github.com/rubensjrcosta/feupy"
Issues = "https://github.com/rubensjrcosta/feupy/issues"


[tool.setuptools.package-data]
feupy = [
    "visualization/styles/*.mplstyle",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["feupy*"]


[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]


[tool.ruff]
line-length = 88
target-version = "py310"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"